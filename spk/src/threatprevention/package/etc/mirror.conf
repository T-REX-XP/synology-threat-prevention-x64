# Copy LAN↔WAN traffic from the LAN gateway into local tps0 for Suricata.
# encap=gretap — OpenWrt GRE tap (apply etc/openwrt/apply-tps-mirror.sh).
# encap=tzsp   — MikroTik sniff-tzsp UDP 37008 (apply etc/mikrotik/apply-tps-mirror.rsc).
# 1 = capture on tps0 (created at package start). 0 = capture on the NAS LAN NIC (ovs_eth0).
enabled=0
router_kind=openwrt
encap=gretap
router_ip=192.168.1.1
# Empty local_ip: pick the IPv4 used to reach router_ip (gretap only).
local_ip=
ifname=tps0
