# Same-origin API for the official ExtJS app → tpsweb :19557.
# proxy_pass URI must be /api (not /). A trailing-slash rewrite to /
# made tpsweb serve missing index.html and return 404.
# /webman/tps-api sits outside location ^~ /webman/3rdparty/.
location = /webman/tps-api {
	proxy_pass http://127.0.0.1:19557/api;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 120s;
}
location = /webman/3rdparty/ThreatPrevention/api {
	proxy_pass http://127.0.0.1:19557/api;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 120s;
}
