<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Router traffic copy onto NAS tps0</title>
  <desc id="desc">LAN clients exchange traffic with the WAN through the LAN gateway. OpenWrt copies that traffic with nft dup over gretap (DSM Firewall GRE protocol 47). MikroTik copies it with sniff-tzsp on UDP 37008. The copy arrives on NAS tps0 and is inspected by Suricata.</desc>
  <rect width="720" height="400" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067b1"/>
    </marker>
  </defs>

  <rect x="24" y="28" width="168" height="52" rx="8" fill="#f4f7fa" stroke="#3b4a5a" stroke-width="1.5"/>
  <text x="108" y="59" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933">LAN clients</text>

  <line x1="192" y1="54" x2="248" y2="54" stroke="#3b4a5a" stroke-width="1.75" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="248" y="28" width="168" height="52" rx="8" fill="#e8f2fb" stroke="#0067b1" stroke-width="1.75"/>
  <text x="332" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933">LAN</text>
  <text x="332" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b7a">gateway</text>

  <line x1="416" y1="54" x2="504" y2="54" stroke="#3b4a5a" stroke-width="1.75" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="504" y="28" width="168" height="52" rx="8" fill="#f4f7fa" stroke="#3b4a5a" stroke-width="1.5"/>
  <text x="588" y="59" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933">WAN</text>

  <circle cx="460" cy="54" r="5" fill="#0067b1"/>
  <line x1="460" y1="59" x2="460" y2="292" stroke="#0067b1" stroke-width="1.75"/>
  <polygon points="460,304 454,292 466,292" fill="#0067b1"/>

  <rect x="484" y="118" width="212" height="72" rx="8" fill="#f4f7fa" stroke="#d5dee7"/>
  <text x="496" y="142" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2933">OpenWrt</text>
  <text x="496" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933">nft dup &#8594; gretap</text>
  <text x="496" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b7a">DSM Firewall: GRE proto 47</text>

  <rect x="484" y="202" width="212" height="72" rx="8" fill="#f4f7fa" stroke="#d5dee7"/>
  <text x="496" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2933">MikroTik</text>
  <text x="496" y="246" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933">sniff-tzsp UDP 37008</text>
  <text x="496" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b7a">DSM Firewall: UDP 37008</text>

  <text x="448" y="200" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0067b1">traffic copy</text>

  <rect x="376" y="316" width="168" height="52" rx="8" fill="#e8f2fb" stroke="#0067b1" stroke-width="1.75"/>
  <text x="460" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933">NAS tps0</text>
  <text x="460" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b7a">local tap</text>

  <line x1="544" y1="342" x2="564" y2="342" stroke="#0067b1" stroke-width="1.75" marker-end="url(#arrowBlue)"/>

  <rect x="568" y="316" width="128" height="52" rx="8" fill="#e8f2fb" stroke="#0067b1" stroke-width="1.75"/>
  <text x="632" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933">Suricata</text>
  <text x="632" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b6b7a">IDS inspect</text>
</svg>
