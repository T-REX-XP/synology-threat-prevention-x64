name: Release engine

# Prebuild Suricata (linux/amd64 + vendored libs). Do not attach a packed SPK:
# that would ship Synology ExtJS. NAS hosts run ./install.sh to assemble + install.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend envelope tests
        run: python3 spk/src/threatprevention/python/test_compat.py

  engine:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Suricata, vendor libs, strip, tarball
        run: ./build/suricata-8/build.sh
      - name: SHA-256
        run: |
          cd artifact
          sha256sum suricata-8.0.6-linux-amd64.tar.gz | tee suricata-8.0.6-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: suricata-engine
          path: |
            artifact/suricata-8.0.6-linux-amd64.tar.gz
            artifact/suricata-8.0.6-linux-amd64.tar.gz.sha256
          if-no-files-found: error
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifact/suricata-8.0.6-linux-amd64.tar.gz
            artifact/suricata-8.0.6-linux-amd64.tar.gz.sha256
          body: |
            Prebuilt **Suricata 8.0.6** (linux/amd64) with vendored libs for DSM 7.

            This release does **not** include a packed SPK or official Synology UI.

            On the NAS (no Docker, no compile):

            ```
            git clone https://github.com/${{ github.repository }}.git
            cd syno-router-review
            sudo ./install.sh --repo ${{ github.repository }}
            ```
