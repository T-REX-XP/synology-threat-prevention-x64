name: Release engine

# Native compile on GitHub-hosted Ubuntu (no Docker). Matrix: x86_64 + aarch64.
# Packed SPK / official ExtJS are not attached. NAS: ./install.sh
#
# GitHub tag (v0.2.0) is the release label. Engine number is SURICATA_VERSION
# in VERSION. SPK INFO version is the git branch or tag (not VERSION).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load versions
        run: |
          set -euo pipefail
          . ./VERSION
          SCRIPT_DIR="$PWD"
          # shellcheck source=spk/pkg-version.sh
          . ./spk/pkg-version.sh
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"
          echo "SURICATA_VERSION=${SURICATA_VERSION} PKG_VERSION=${PKG_VERSION}"
      - name: Backend envelope tests
        run: python3 spk/src/threatprevention/python/test_compat.py

  engine:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            suffix: linux-amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Load versions
        run: |
          set -euo pipefail
          . ./VERSION
          {
            echo "SURICATA_VERSION=${SURICATA_VERSION}"
            echo "ENGINE_ASSET=suricata-${SURICATA_VERSION}-${{ matrix.suffix }}.tar.gz"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: rust-${{ matrix.arch }}-${{ env.SURICATA_VERSION }}
      - name: Native Suricata (${{ matrix.arch }}, no Docker)
        env:
          TPS_ARCH: ${{ matrix.arch }}
        run: ./build/suricata-8/build.sh --native --arch ${{ matrix.arch }}
      - name: SHA-256
        run: |
          cd artifact
          sha256sum "${ENGINE_ASSET}" | tee "${ENGINE_ASSET}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: suricata-engine-${{ matrix.arch }}
          path: |
            artifact/${{ env.ENGINE_ASSET }}
            artifact/${{ env.ENGINE_ASSET }}.sha256
          if-no-files-found: error

  publish:
    needs: [tests, engine]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load versions
        run: |
          set -euo pipefail
          . ./VERSION
          echo "SURICATA_VERSION=${SURICATA_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: suricata-engine-*
          path: artifact
          merge-multiple: true
      - name: List assets
        run: ls -lh artifact/
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifact/suricata-*-linux-*.tar.gz
            artifact/suricata-*-linux-*.tar.gz.sha256
          body: |
            Prebuilt **Suricata ${{ env.SURICATA_VERSION }}** for DSM 7 (vendored libs, stripped).

            | Arch | Asset |
            | --- | --- |
            | x86_64 | `suricata-${{ env.SURICATA_VERSION }}-linux-amd64.tar.gz` |
            | aarch64 | `suricata-${{ env.SURICATA_VERSION }}-linux-arm64.tar.gz` |

            Package: `${{ github.ref_name }}`. Built **natively** on GitHub-hosted Ubuntu (no Docker).

            This release does **not** include a packed SPK or official Synology UI.

            Always latest installer + latest engine:

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```

            Optional — pin the engine to this release (`--tag` is optional):

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash -s -- --tag ${{ github.ref_name }}
            ```
