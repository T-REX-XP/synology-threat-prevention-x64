name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load versions
        run: |
          set -euo pipefail
          . ./VERSION
          echo "SURICATA_VERSION=${SURICATA_VERSION} ref=${GITHUB_REF_NAME}"
      - name: Backend envelope tests
        run: python3 spk/src/threatprevention/python/test_compat.py
